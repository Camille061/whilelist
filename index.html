<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberpunk Card</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<h3 style="color: #ff0000;">สมัครไวริส</h3>

<form id="form">
  <input type="text" id="discord" placeholder="ชื่อดิส" required>
  <input type="text" id="role" placeholder="ชื่อโรล">
  <input type="text" id="height" placeholder="ส่วนสูง">
  <input type="text" id="weight" placeholder="น้ำหนัก">
  <input type="text" id="age" placeholder="อายุ">
  <input type="text" id="character" placeholder="นิสัย">
  <input type="text" id="ability" placeholder="ความสามารถพิเศษ">

  <select id="magic">
    <option value="">นักเรียน</option>
    <option value="นักเรียน">นักเลง</option>
    <option value="อาจารย์">อาจารย์</option>
    <option value="นักล่าค่าหัว">โจร</option>
    <option value="ผู้พิทักษ์">ตำรวจ</option>
  </select>

  <textarea id="reason" placeholder="เหตุผล"></textarea>
  <input type="file" id="img" accept="image/*">

  <div style="text-align:center;">
    <button type="submit">สร้างไวริส</button>
  </div>
</form>

<div class="card" id="card">
  <h1 style="
    text-align:center;
    color: #ffd300;
    text-shadow:
      0 0 5px #ffd300,
      0 0 10px #ffd300,
      0 0 20px #ffea00,
      0 0 40px #ffcc00;
  ">
  ✦ Cyberpunk ✦
  </h1>

  <div class="card-content">
    
    <!-- ✅ ใช้ img-box -->
    <div class="img-box">
      <img id="cardImg">
    </div>

    <div class="info" id="info"></div>
  </div>
</div>

<script>
const form = document.getElementById("form");
const card = document.getElementById("card");
const info = document.getElementById("info");
const cardImg = document.getElementById("cardImg");
const imgInput = document.getElementById("img");

let imageData = "";

/* โหลดรูป */
imgInput.addEventListener("change", function () {
  const reader = new FileReader();
  reader.onload = e => imageData = e.target.result;

  if (this.files[0]) {
    reader.readAsDataURL(this.files[0]);
  }
});

/* submit */
form.addEventListener("submit", (e) => {
  e.preventDefault();

  const discord = document.getElementById("discord").value;
  const role = document.getElementById("role").value;
  const height = document.getElementById("height").value;
  const weight = document.getElementById("weight").value;
  const magic = document.getElementById("magic").value;
  const reason = document.getElementById("reason").value;
  const character = document.getElementById("character").value;
  const ability = document.getElementById("ability").value;
  const age = document.getElementById("age").value;

  info.innerHTML = `
  <b>ชื่อ:</b> ${discord}<br>
  <b>โรล:</b> ${role}<br>
  <b>ส่วนสูง:</b> ${height}<br>
  <b>น้ำหนัก:</b> ${weight}<br>
  <b>อายุ:</b> ${age}<br>
  <b>นิสัย:</b> ${character}<br>
  <b>บทบาท:</b> ${magic}<br>
  <b>เหตุผล:</b> ${reason}<br>
  <b>ความสามารถ:</b> ${ability}
  `;

  cardImg.src = imageData || "";
  card.style.display = "block";

  form.reset();
  imageData = "";
});
</script>

</body>
</html>
